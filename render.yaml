services:
  - type: web
    name: Alfanio
    env: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    headers:
      - path: /*
        name: Cache-Control
        value: public, max-age=0, must-revalidate
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /*.js
        name: Content-Type
        value: application/javascript
      - path: /*.css
        name: Content-Type
        value: text/css
      - path: /*.png
        name: Content-Type
        value: image/png
      - path: /*.jpg
        name: Content-Type
        value: image/jpeg
      - path: /*.svg
        name: Content-Type
        value: image/svg+xml
      - path: /*.webp
        name: Content-Type
        value: image/webp
      - path: /*.woff
        name: Content-Type
        value: font/woff
      - path: /*.woff2
        name: Content-Type
        value: font/woff2
    routes:
      - type: proxy
        source: /api/*
        destination: https://alfanio-backend.onrender.com/api/:splat
      - type: proxy
        source: /contact/*
        destination: https://alfanio-backend.onrender.com/contact/:splat
      - type: proxy
        source: /brochure/*
        destination: https://alfanio-backend.onrender.com/brochure/:splat
      - type: rewrite
        source: /*
        destination: /index.html
    autoDeploy: true

  - type: web
    name: alfanio-backend
    env: node
    rootDir: backend
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: NODE_ENV
        value: production
      - key: RENDER
        value: "true"
      - key: EMAIL_TO
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_LEADS_TABLE
        value: lead_submissions
      - key: EMAIL_FROM_NAME
        value: Alfanio India
      # Canonical public domain. Update the CNAME on the Render static site to
      # map www.alfanio.com -> this service.
      - key: CLIENT_URL
        value: https://www.alfanio.com
      - key: FRONTEND_URL
        value: https://www.alfanio.com
      - key: JWT_SECRET
        sync: false
      - key: COOKIE_SECRET
        sync: false
    healthCheckPath: /healthz
    autoDeploy: true
